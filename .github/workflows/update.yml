name: Uppdatera data

on:
  schedule:
    - cron: '15 */3 * * *'   # var tredje timme; odds hämtas bara en gång per dygn
  workflow_dispatch:
    inputs:
      odds:
        description: 'Hämta nya odds direkt (kostar ca 2 anrop per liga)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Hämta statistik och odds
        run: node scripts/fetch.mjs ${{ inputs.odds && '--odds' || '' }}
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Spara data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Uppdatera data"
          # Om någon hunnit ladda upp kod under tiden: hämta det senaste och försök igen.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --no-edit || exit 1
          done
          exit 1
