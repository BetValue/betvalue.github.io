<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0f1115">
  <title>Matchvärde</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%2322c55e'/><path d='M9 21l5-6 4 3 5-8' stroke='%230f1115' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo"></span>Matchvärde</div>
    <nav class="tabs" id="tabs">
      <button data-view="matcher" class="active">Matcher</button>
      <button data-view="varde">Värdebets</button>
      <button data-view="tabeller">Tabeller</button>
    </nav>
  </header>

  <div class="chips" id="chips"></div>
  <div class="days" id="days"></div>
  <main id="main"><p class="empty">Laddar…</p></main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button class="close" data-close aria-label="Stäng">×</button>
      <div id="sheet-body"></div>
    </div>
  </div>

  <footer>
    <p id="updated"></p>
    <p>Sannolikheterna kommer från en statistisk modell och är ingen garanti. Spela aldrig för mer än du har råd att förlora. 18+ · <a href="https://www.stodlinjen.se" target="_blank" rel="noopener">Stödlinjen.se</a></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
